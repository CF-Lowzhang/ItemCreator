
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11161d">
<meta name="description" content="ox_inventory 道具建立器">
<title>ox_inventory 道具建立器</title>
<style>
:root{
  font-family:Inter,"Segoe UI","Noto Sans TC",sans-serif;
  font-size:clamp(15px,1.05vw,19px);
  color:#e8edf4;
  background:#11161d;
  font-synthesis:none
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(ellipse at 75% -10%,#27334a 0,transparent 42%),#11161d
}
main{
  width:min(100% - 24px,1440px);
  margin-inline:auto;
  padding:24px 0 36px
}
header{margin-bottom:16px}
.eyebrow{
  font-size:clamp(12px,.85vw,15px);
  letter-spacing:.16em;
  color:#93a7c0
}
h1{
  margin:5px 0;
  font-size:clamp(26px,2vw,36px);
  letter-spacing:-.04em
}
.intro{
  margin:0;
  color:#98a5b5;
  font-size:clamp(14px,1vw,18px);
  line-height:1.65
}
.panel{
  padding:clamp(14px,1.4vw,25px);
  border:1px solid #2b3542;
  border-radius:12px;
  background:#171d25
}
.section-title{
  margin:0 0 12px;
  color:#e3ebf5;
  font-size:clamp(16px,1.15vw,21px)
}

/* 道具資料 */
.fields{
  display:grid;
  grid-template-columns:repeat(12,minmax(0,1fr));
  gap:clamp(10px,.9vw,15px);
  align-items:end
}
.field{
  display:grid;
  align-content:start;
  gap:7px;
  min-width:0;
  color:#aab8c8;
  font-size:clamp(13px,.95vw,17px)
}
.field input,.field textarea,.field select,.status-max input{
  width:100%;
  min-width:0;
  max-width:100%;
  border:1px solid #3c4959;
  background:#111820;
  color:#f0f4f8;
  padding:clamp(9px,.75vw,13px) 11px;
  border-radius:6px;
  font:inherit;
  font-size:clamp(14px,1vw,18px)
}
.field textarea{
  resize:none;
  overflow:hidden;
  min-height:0;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}
.field input:focus,.field textarea:focus,.status-max input:focus{
  outline:2px solid #69b79a;
  outline-offset:1px
}
.item-name,.item-member-type,.item-member-number{grid-column:span 3}
.item-english{grid-column:1/span 3}
.item-label{grid-column:span 3}
.item-weight{grid-column:span 2}
.item-consume{grid-column:span 2}
.item-time{grid-column:span 2}
.item-description,.item-goal{grid-column:1/-1}
.item-goal{margin-top:12px}

/* 摺疊區塊 */
.collapse-panel{
  margin-top:12px;
  border:1px solid #303e4d;
  border-radius:9px;
  background:#151d26;
  overflow:hidden
}
.collapse-panel summary{
  display:flex;
  align-items:center;
  gap:10px;
  padding:clamp(12px,1vw,17px) 15px;
  color:#dce9f7;
  font-size:clamp(15px,1.05vw,19px);
  font-weight:600;
  cursor:pointer;
  list-style:none;
  user-select:none
}
.collapse-panel summary::-webkit-details-marker{display:none}
.collapse-panel summary:hover{background:#202b38}
.collapse-panel summary::before{
  content:"";
  width:8px;
  height:8px;
  flex-shrink:0;
  border-right:2px solid #92a8c0;
  border-bottom:2px solid #92a8c0;
  transform:rotate(-45deg);
  transition:transform .15s
}
.collapse-panel[open] summary::before{transform:rotate(45deg)}
.collapse-hint{
  color:#8493a4;
  font-size:clamp(12px,.85vw,15px);
  font-weight:400
}
.collapse-content{
  padding:clamp(12px,1vw,18px);
  border-top:1px solid #303e4d
}

/* 額外調整 */
.extra-fields{
  display:grid;
  grid-template-columns:repeat(12,minmax(0,1fr));
  align-items:end;
  gap:clamp(10px,.9vw,15px)
}
.item-stack,.item-close{grid-column:span 2}
.item-animation{grid-column:span 3}
.item-event{grid-column:span 5}

/* 單選按鈕 */
.choice-options{
  display:inline-flex;
  align-items:stretch;
  width:max-content;
  max-width:100%;
  border:1px solid #3c4959;
  border-radius:6px;
  overflow:hidden;
  background:#111820
}
.choice-options label{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:clamp(56px,4vw,72px);
  padding:clamp(9px,.75vw,13px) 12px;
  color:#b9c9d9;
  font-size:clamp(13px,.9vw,16px);
  cursor:pointer;
  white-space:nowrap
}
.choice-options label+label{border-left:1px solid #3c4959}
.choice-options input{
  position:absolute;
  opacity:0;
  width:1px;
  height:1px
}
.choice-options label:has(input:checked){
  background:#25483f;
  color:#c9f5e6;
  font-weight:600
}
.choice-options label:focus-within{
  outline:2px solid #69b79a;
  outline-offset:-2px
}

/* 狀態變化 */
.status-heading{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:12px;
  flex-wrap:wrap
}
.status-max{
  display:flex;
  align-items:center;
  gap:8px;
  color:#aab8c8;
  font-size:clamp(13px,.9vw,16px);
  white-space:nowrap
}
.status-max input{width:clamp(115px,9vw,155px)}
.status-fields{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:clamp(9px,.85vw,14px);
  margin-top:12px
}
.status-fields .field input{max-width:100%}
.status-panel{margin-top:12px;border:1px solid #303e4d;border-radius:9px;background:#151d26;overflow:hidden}
.status-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-right:15px}
.status-toggle{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:clamp(12px,1vw,17px) 15px;border:0;background:transparent;color:#dce9f7;text-align:left;font:inherit;font-size:clamp(15px,1.05vw,19px);font-weight:600;cursor:pointer}
.status-toggle::before{content:"";width:8px;height:8px;flex-shrink:0;border-right:2px solid #92a8c0;border-bottom:2px solid #92a8c0;transform:rotate(-45deg);transition:transform .15s}
.status-panel.open .status-toggle::before{transform:rotate(45deg)}
.status-toggle:hover{background:#202b38}
.status-toggle .collapse-hint{font-weight:400}
.status-panel .status-heading{justify-content:flex-end}
.status-panel .collapse-content[hidden]{display:none}

/* Lua 輸出：一律上下排列 */
.outputs{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:14px;
  margin-top:16px
}
.output{min-width:0}
.output[hidden]{display:none}
.output-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:40px;
  margin-bottom:7px;
  color:#dce9f7;
  font-size:clamp(14px,1vw,18px)
}
.actions{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap
}
.button{
  border:1px solid #426c62;
  border-radius:6px;
  background:#16332e;
  color:#a8ead2;
  padding:9px 12px;
  font:inherit;
  font-size:clamp(13px,.9vw,16px);
  white-space:nowrap;
  cursor:pointer
}
.button:hover{filter:brightness(1.15)}
.format-button{
  border-color:#354c6a;
  background:#26384f;
  color:#e2efff
}
.output textarea{
  display:block;
  width:100%;
  height:auto;
  min-height:0;
  resize:none;
  overflow:hidden;
  border:1px solid #303e4d;
  border-radius:8px;
  background:#10151b;
  color:#dce9f7;
  padding:12px;
  font:clamp(13px,.95vw,17px)/1.7 ui-monospace,Consolas,monospace;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  tab-size:4
}
.feedback{
  min-height:20px;
  margin-top:8px;
  color:#9be0c5;
  font-size:clamp(12px,.85vw,15px)
}
.footnote{
  margin:10px 2px 0;
  color:#78889b;
  font-size:clamp(12px,.85vw,15px);
  line-height:1.5
}

/* 中型桌面 */
@media(max-width:1100px){
  .item-name,.item-member-type,.item-member-number,.item-english,.item-label{grid-column:span 4}
  .item-weight,.item-consume,.item-time{grid-column:span 4}
  .item-stack,.item-close{grid-column:span 3}
  .item-animation,.item-event{grid-column:span 6}
  .status-fields{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* 平板 */
@media(max-width:800px){
  .item-name,.item-member-type,.item-member-number,.item-english,.item-label,.item-weight,
  .item-consume,.item-time{grid-column:span 6}
  .extra-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  .item-stack,.item-close,.item-animation,.item-event{grid-column:span 1}
  .status-fields{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* 手機 */
@media(max-width:560px){
  main{
    width:calc(100% - 16px);
    padding-top:16px
  }
  .panel{padding:14px}
  .fields,.extra-fields{gap:10px}
  .item-name,.item-member-type,.item-member-number,.item-english,.item-label,.item-weight,
  .item-consume,.item-time{grid-column:1/-1}
  .extra-fields{grid-template-columns:minmax(0,1fr)}
  .item-stack,.item-close,.item-animation,.item-event{grid-column:1/-1}
  .status-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  .status-max{width:100%;justify-content:space-between}
  .status-max input{width:120px}
  .collapse-panel summary{padding:12px}
  .collapse-hint{line-height:1.5}
  .output-head{align-items:flex-start;flex-wrap:wrap}
  .actions{flex-wrap:wrap}
}
</style>
</head>
<body>
<main>
  <header>
    <h1>道具建立器</h1>
    <p class="intro">填好道具資料，產生讓道具系統可以處理的 <code>items.lua</code> 和 <code>client.lua</code> 相關程式，並且貼給「相關團隊進行處理」</p>
  </header>

  <section class="panel" aria-labelledby="itemFieldsTitle">
    <h2 class="section-title" id="itemFieldsTitle">道具資料</h2>

    <form id="itemForm" autocomplete="off">
      <div class="fields">
        <label class="field item-name">
          企劃名稱
          <input name="projectName" required value="pxz2" maxlength="16" placeholder="pxz2">
        </label>

        <label class="field item-member-type">
          會員類別
          <select name="memberType"><option value="s">演員（S）</option><option value="t" selected>團隊（T）</option></select>
        </label>

        <label class="field item-member-number">
          會員編號
          <input name="memberNumber" required type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" value="0001" placeholder="0001">
        </label>

        <label class="field item-english">
          物品英文
          <input name="itemEnglish" required pattern="[A-Za-z0-9_-]+" value="bear" placeholder="bear">
        </label>

        <label class="field item-label">
          顯示名稱（label）
          <input name="label" required placeholder="豐饒牌精品嫩草">
        </label>

        <label class="field item-weight">
          重量（weight）
          <input name="weight" type="number" min="0" step="any" value="0">
        </label>

        <label class="field item-consume">
          消耗量（consume）
          <input name="consume" type="number" min="0" step="any" value="0">
        </label>

        <label class="field item-time">
          使用時間（usetime，秒）
          <input name="usetime" type="number" min="0" step="any" value="0">
        </label>

        <label class="field item-description">
          描述（description）
          <textarea name="description" rows="1" data-autoheight placeholder="道具描述"></textarea>
        </label>

      </div>

      <!-- 額外調整：預設收合 -->
      <details class="collapse-panel">
        <summary>
          額外調整
          <span class="collapse-hint">堆疊、道具欄、使用動畫與 Client Event</span>
        </summary>

        <div class="collapse-content">
          <div class="extra-fields">
            <div class="field item-stack">
              <span>可堆疊（stack）</span>
              <div class="choice-options" role="radiogroup" aria-label="可堆疊">
                <label><input type="radio" name="stack" value="true" checked>是</label>
                <label><input type="radio" name="stack" value="false">否</label>
              </div>
            </div>

            <div class="field item-close">
              <span>使用後關閉道具欄（close）</span>
              <div class="choice-options" role="radiogroup" aria-label="使用後關閉道具欄">
                <label><input type="radio" name="close" value="true" checked>是</label>
                <label><input type="radio" name="close" value="false">否</label>
              </div>
            </div>

            <div class="field item-animation">
              <span>使用動畫（anim）</span>
              <div class="choice-options" role="radiogroup" aria-label="使用動畫">
                <label><input type="radio" name="anim" value="" checked>無</label>
                <label><input type="radio" name="anim" value="eating">eating</label>
                <label><input type="radio" name="anim" value="drinking">drinking</label>
              </div>
            </div>

            <label class="field item-event">
              Client Event（可留空）
              <input name="event" placeholder="例如 CF_VehicleKey:LockUnlock">
            </label>

            <label class="field item-goal">
              腳本希望達到的事情
              <textarea name="goal" rows="1" data-autoheight placeholder="輸入內容後，自動產生 client.lua 使用登記"></textarea>
            </label>
          </div>
        </div>
      </details>

      <!-- 狀態變化：數值最大值常駐標題列，狀態輸入預設收合 -->
      <section class="status-panel" id="statusPanel">
        <div class="status-title-row">
          <button class="status-toggle" id="statusToggle" type="button" aria-expanded="false" aria-controls="statusContent">
            狀態變化
            <span class="collapse-hint">輸入 0–100%；留空代表不輸出該狀態。</span>
          </button>
          <label class="status-max">狀態值最大值<input name="statusMax" type="number" min="0" step="any" value="1000000"></label>
        </div>
        <div class="collapse-content" id="statusContent" hidden>
          <div class="status-fields">
            <label class="field">飢餓（Hunger，%）<input name="hunger" type="number" min="0" max="100" step="any" placeholder="0–100"></label>
            <label class="field">口渴（Thirst，%）<input name="thirst" type="number" min="0" max="100" step="any" placeholder="0–100"></label>
            <label class="field">醉酒（Drunk，%）<input name="drunk" type="number" min="0" max="100" step="any" placeholder="0–100"></label>
            <label class="field">壓力（Stress，%）<input name="stress" type="number" min="0" max="100" step="any" placeholder="0–100"></label>
            <label class="field">結晶（Crystal，%）<input name="crystal" type="number" min="0" max="100" step="any" placeholder="0–100"></label>
            <label class="field">中毒（Poison，%）<input name="poison" type="number" min="0" max="100" step="any" placeholder="0–100"></label>
            <label class="field">中毒（Bug，%）<input name="bug" type="number" min="0" max="100" step="any" placeholder="0–100"></label>
            <label class="field">火元素（Fire，%）<input name="fire" type="number" min="0" max="100" step="any" placeholder="0–100"></label>
            <label class="field">水元素（Water，%）<input name="water" type="number" min="0" max="100" step="any" placeholder="0–100"></label>
            <label class="field">土元素（Stone，%）<input name="stone" type="number" min="0" max="100" step="any" placeholder="0–100"></label>
            <label class="field">風元素（Wind，%）<input name="wind" type="number" min="0" max="100" step="any" placeholder="0–100"></label>
            <label class="field">能量（Energy，%）<input name="energy" type="number" min="0" max="100" step="any" placeholder="0–100"></label>
          </div>
        </div>
      </section>

    </form>

    <!-- items.lua 在上方，client.lua 有內容才出現在下方 -->
    <div class="outputs" id="outputs">
      <section class="output">
        <div class="output-head">
          <strong>items.lua 道具定義</strong>
          <div class="actions">
            <button class="button format-button" type="button" id="formatToggle" aria-label="切換 Lua 顯示格式">單行顯示</button>
            <button class="button" type="button" data-copy="itemOutput">複製定義</button>
          </div>
        </div>
        <textarea id="itemOutput" readonly rows="1" data-autoheight spellcheck="false" aria-label="items.lua 道具定義"></textarea>
      </section>

      <section class="output" id="clientSection" hidden>
        <div class="output-head">
          <strong>client.lua 腳本登記</strong>
          <button class="button" type="button" data-copy="clientOutput">複製腳本</button>
        </div>
        <textarea id="clientOutput" readonly rows="1" data-autoheight spellcheck="false" aria-label="client.lua 腳本登記"></textarea>
      </section>
    </div>

    <div class="feedback" id="feedback" aria-live="polite"></div>
    <p class="footnote">
      使用時間以秒輸入、毫秒輸出；狀態輸出值依「輸入百分比 × 狀態值最大值 ÷ 100」計算並四捨五入成整數。
      此頁只產生程式碼文字，不會自動修改遊戲檔案。
    </p>
  </section>
</main>

<script>
(() => {
  const form = document.querySelector('#itemForm');
  const field = name => form.elements.namedItem(name);
  const statusNames = ['hunger','thirst','drunk','stress','crystal','poison','bug','fire','water','stone','wind','energy'];

  const itemOutput = document.querySelector('#itemOutput');
  const clientOutput = document.querySelector('#clientOutput');
  const clientSection = document.querySelector('#clientSection');
  const formatToggle = document.querySelector('#formatToggle');

  let format = 'single';

  const luaString = value => `'${String(value).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r\n|\r|\n/g,'\\n')}'`;
  const value = name => String(field(name).value ?? '').trim();
  const selected = name => form.querySelector(`input[name="${name}"]:checked`)?.value;

  function autoHeight(element) {
    if (!element || element.offsetParent === null) return;
    element.style.height = 'auto';
    element.style.height = `${element.scrollHeight + 2}px`;
  }

  function updateHeights() {
    document.querySelectorAll('textarea[data-autoheight]').forEach(autoHeight);
  }

  function generate() {
    const projectName = value('projectName').toLowerCase();
    const memberType = value('memberType').toLowerCase();
    const memberNumber = value('memberNumber');
    const itemEnglish = value('itemEnglish').toLowerCase();
    const name = `${projectName}${memberType}${memberNumber}-${itemEnglish}`;
    const label = value('label');
    const goalText = value('goal');
    const anim = selected('anim') || '';
    const hasClient = goalText !== '';

    clientSection.hidden = !hasClient;
    formatToggle.textContent = format === 'single' ? '單行顯示' : '展開顯示';

    const validName = /^[a-z0-9]+$/.test(projectName) && /^[st]$/.test(memberType) && /^[0-9]{4}$/.test(memberNumber) && /^[a-z0-9_-]+$/.test(itemEnglish);
    const badPercent = statusNames.some(key =>
      value(key) !== '' &&
      (!Number.isFinite(Number(value(key))) || Number(value(key)) < 0 || Number(value(key)) > 100)
    );
    const badMax = value('statusMax') !== '' &&
      (!Number.isFinite(Number(value('statusMax'))) || Number(value('statusMax')) < 0);
    const badTime = value('usetime') !== '' &&
      (!Number.isFinite(Number(value('usetime'))) || Number(value('usetime')) < 0);

    if (!validName || !label || badPercent || badMax || badTime) {
      itemOutput.value = badPercent ? '狀態百分比需介於 0 到 100。'
        : badMax ? '狀態值最大值需為 0 或正數。'
        : badTime ? '使用時間需為 0 或正數。'
        : validName ? '請輸入道具顯示名稱。'
        : '企劃名稱需為英數字、會員編號需為四位數，物品英文限英數字、底線或連字號。';
      clientOutput.value = '';
      updateHeights();
      return;
    }

    const properties = [
      `label = ${luaString(label)}`,
      `weight = ${value('weight') || '0'}`,
      `stack = ${selected('stack') === 'true' ? 'true' : 'false'}`,
      `close = ${selected('close') === 'true' ? 'true' : 'false'}`
    ];

    if (value('consume') !== '') properties.push(`consume = ${value('consume')}`);
    if (anim) properties.push(`anim = ${luaString(anim)}`);
    if (value('description')) properties.push(`description = ${luaString(value('description'))}`);

    const client = [];
    if (value('event')) client.push(`event = ${luaString(value('event'))}`);

    const maximum = value('statusMax') === '' ? 1000000 : Number(value('statusMax'));
    const statuses = statusNames.filter(key => value(key) !== '')
      .map(key => `${key} = ${Math.round(Number(value(key)) * maximum / 100)}`);

    if (statuses.length) client.push(`status = { ${statuses.join(', ')} }`);

    if (value('usetime') !== '') {
      const milliseconds = Math.round(Number(value('usetime')) * 1000);
      client.push(`usetime = ${milliseconds}`);
    }

    if (client.length) {
      properties.push(format === 'single'
        ? `client = { ${client.join(', ')} }`
        : `client = {\n${client.map(entry => `        ${entry}`).join(',\n')}\n    }`);
    }

    itemOutput.value = format === 'single'
      ? `['${name}'] = { ${properties.join(', ')} },`
      : `['${name}'] = {\n${properties.map(entry => `    ${entry}`).join(',\n')}\n},`;

    if (hasClient) {
      const goal = goalText.split(/\r\n|\r|\n/)
        .filter(line => line.trim())
        .map(line => `    -- 目標：${line}`);
      clientOutput.value = [
        `Item('${name}', function(data, slot)`,
        ...goal,
        '    -- TODO：請依照以上目標實作使用效果。',
        'end)'
      ].join('\n');
    } else {
      clientOutput.value = '';
    }

    updateHeights();
  }

  form.addEventListener('input', generate);
  form.addEventListener('change', generate);

  const statusToggle = document.querySelector('#statusToggle');
  const statusContent = document.querySelector('#statusContent');
  statusToggle.addEventListener('click', () => {
    const isOpen = statusContent.hidden;
    statusContent.hidden = !isOpen;
    statusToggle.setAttribute('aria-expanded', String(isOpen));
    document.querySelector('#statusPanel').classList.toggle('open', isOpen);
    updateHeights();
  });

  document.querySelectorAll('[data-autoheight]').forEach(element => {
    element.addEventListener('input', () => autoHeight(element));
  });

  formatToggle.addEventListener('click', () => {
    format = format === 'single' ? 'expanded' : 'single';
    generate();
  });

  document.querySelectorAll('[data-copy]').forEach(button =>
    button.addEventListener('click', async () => {
      const output = document.querySelector(`#${button.dataset.copy}`);
      try {
        await navigator.clipboard.writeText(output.value);
      } catch {
        output.focus();
        output.select();
        document.execCommand('copy');
      }

      const feedback = document.querySelector('#feedback');
      feedback.textContent = button.dataset.copy === 'itemOutput'
        ? 'items.lua 定義已複製。'
        : 'client.lua 腳本已複製。';

      window.setTimeout(() => {
        feedback.textContent = '';
      }, 2200);
    })
  );

  window.addEventListener('resize', updateHeights);
  generate();
})();
</script>
</body>
</html>
